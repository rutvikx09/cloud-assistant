<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloud Agent</title>
  <style>
    :root {
      --bg: #0b0d12;
      --surface: #12151c;
      --surface-2: #181c26;
      --border: #232836;
      --text: #e7e9ee;
      --muted: #8a92a3;
      --accent: #ff9900;
      --accent-2: #7c5cff;
      --cyan: #22d3ee;
      --ok: #22c55e;
      --error: #ff6b81;
      --user-bg: linear-gradient(135deg, #2a3142, #1f2533);
      --code-bg: #0a0c10;
      --shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
    }

    [data-theme="light"] {
      --bg: #f4f5f9;
      --surface: #ffffff;
      --surface-2: #f0f2f7;
      --border: #e1e4ec;
      --text: #171a22;
      --muted: #667085;
      --error: #c81e3a;
      --user-bg: linear-gradient(135deg, #1f2937, #111827);
      --code-bg: #f3f4f7;
      --shadow: 0 10px 30px rgba(20, 24, 40, 0.08);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(1200px 600px at 80% -10%, rgba(124, 92, 255, 0.10), transparent 60%),
        radial-gradient(900px 500px at -10% 110%, rgba(255, 153, 0, 0.08), transparent 60%),
        var(--bg);
      color: var(--text);
      display: flex;
      overflow: hidden;
    }

    button { font: inherit; cursor: pointer; }

    /* ---------- Orb (agent avatar) ---------- */
    .orb {
      position: relative;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      flex-shrink: 0;
      background: conic-gradient(from 0deg, var(--accent), var(--accent-2), var(--cyan), var(--accent));
      animation: spin 5s linear infinite;
      box-shadow: 0 0 18px rgba(124, 92, 255, 0.35);
    }
    .orb::after {
      content: "";
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      background: var(--surface);
    }
    .orb.big { width: 64px; height: 64px; margin: 0 auto 18px; }
    .orb.big::after { inset: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- Sidebar ---------- */
    aside {
      width: 280px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease;
    }

    .brand {
      padding: 20px 18px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-name { font-weight: 700; letter-spacing: -0.01em; }
    .brand-sub { font-size: 0.72rem; color: var(--muted); }

    .new-chat {
      margin: 0 14px 14px;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: linear-gradient(135deg, rgba(255,153,0,0.12), rgba(124,92,255,0.12));
      color: var(--text);
      font-weight: 600;
      text-align: left;
      transition: border-color 0.2s, transform 0.15s;
    }
    .new-chat:hover { border-color: var(--accent); transform: translateY(-1px); }

    .section-label {
      padding: 8px 18px 6px;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    #session-list {
      list-style: none;
      margin: 0;
      padding: 0 10px;
      overflow-y: auto;
      flex: 1;
    }

    .session {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 10px;
      border-radius: 10px;
      margin-bottom: 3px;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--muted);
      transition: background 0.15s, color 0.15s;
    }
    .session:hover { background: var(--surface-2); color: var(--text); }
    .session.active { background: var(--surface-2); color: var(--text); box-shadow: inset 2px 0 0 var(--accent); }

    .session-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .session-delete {
      opacity: 0;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.05rem;
      padding: 0 6px;
      border-radius: 6px;
    }
    .session:hover .session-delete { opacity: 1; }
    .session-delete:hover { color: var(--error); }

    /* Agent status card */
    .status-card {
      margin: 12px 14px 16px;
      padding: 14px;
      border-radius: 14px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--muted);
    }
    .status-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .status-row:last-child { margin-bottom: 0; }
    .status-row b { color: var(--text); font-weight: 600; }
    .live-dot {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 8px var(--ok);
      margin-right: 6px;
    }

    /* ---------- Main ---------- */
    main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 22px;
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg) 85%, transparent);
      backdrop-filter: blur(10px);
    }

    .header-left { display: flex; align-items: center; gap: 12px; min-width: 0; }

    #menu-btn {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 6px 10px;
    }

    .title-text {
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .header-right { display: flex; align-items: center; gap: 10px; }

    .pill {
      font-size: 0.74rem;
      padding: 5px 11px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
    .pill.busy .dot { background: var(--accent); animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

    .icon-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 0.9rem;
    }
    .icon-btn:hover { border-color: var(--accent); }

    /* ---------- Chat ---------- */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 28px 16px 12px;
      scroll-behavior: smooth;
    }

    .inner { max-width: 800px; margin: 0 auto; }

    .welcome {
      text-align: center;
      margin-top: 9vh;
      animation: fadeUp 0.5s ease;
    }
    .welcome h2 {
      margin: 0 0 8px;
      font-size: 1.7rem;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, var(--text), var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .welcome p { color: var(--muted); margin: 0 0 28px; }

    .chips {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 12px;
    }
    .chip {
      text-align: left;
      padding: 16px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-weight: 600;
      box-shadow: var(--shadow);
      transition: transform 0.15s, border-color 0.15s;
    }
    .chip:hover { transform: translateY(-2px); border-color: var(--accent-2); }
    .chip small {
      display: block;
      color: var(--muted);
      font-weight: 400;
      margin-top: 4px;
      font-size: 0.8rem;
    }

    .row {
      display: flex;
      gap: 12px;
      margin-bottom: 22px;
      animation: fadeUp 0.3s ease;
    }
    .row.user { flex-direction: row-reverse; }

    .avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      font-size: 0.7rem;
      font-weight: 700;
    }
    .row.user .avatar { background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); }

    .content { max-width: 85%; min-width: 0; }
    .row.user .content { display: flex; flex-direction: column; align-items: flex-end; }

    .bubble {
      padding: 14px 18px;
      border-radius: 18px;
      line-height: 1.65;
      font-size: 0.95rem;
      overflow-wrap: anywhere;
    }

    .row.user .bubble {
      background: var(--user-bg);
      color: #f3f4f6;
      white-space: pre-wrap;
      border-top-right-radius: 6px;
    }

    .row.assistant .bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      border-top-left-radius: 6px;
    }
    .row.assistant .bubble.error { border-color: var(--error); color: var(--error); }

    .bubble p { margin: 0 0 10px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble h3 { font-size: 1.05rem; margin: 16px 0 6px; }
    .bubble h4 { font-size: 0.98rem; margin: 14px 0 6px; }
    .bubble ul, .bubble ol { margin: 6px 0 10px; padding-left: 22px; }
    .bubble li { margin-bottom: 5px; }
    .bubble strong { color: var(--text); }

    .bubble code {
      background: var(--code-bg);
      padding: 2px 6px;
      border-radius: 6px;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 0.86em;
      border: 1px solid var(--border);
    }
    .bubble pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      overflow-x: auto;
      margin: 12px 0;
    }
    .bubble pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 0.85em;
      white-space: pre;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
      padding: 0 4px;
      font-size: 0.72rem;
      color: var(--muted);
    }
    .copy-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.72rem;
      padding: 2px 6px;
      border-radius: 6px;
      opacity: 0;
      transition: opacity 0.15s, color 0.15s;
    }
    .row:hover .copy-btn { opacity: 1; }
    .copy-btn:hover { color: var(--accent); }

    /* Agent thinking pipeline */
    .thinking {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px 18px;
      box-shadow: var(--shadow);
      min-width: 280px;
    }
    .thinking-title {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 10px;
      letter-spacing: 0.02em;
    }
    .pipeline { display: flex; flex-direction: column; gap: 8px; }
    .step {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: var(--muted);
      transition: color 0.3s;
    }
    .step .dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      flex-shrink: 0;
      transition: all 0.3s;
    }
    .step.active { color: var(--text); }
    .step.active .dot {
      border-color: var(--accent);
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      animation: pulse 1s infinite;
    }
    .step.done { color: var(--muted); }
    .step.done .dot { border-color: var(--ok); background: var(--ok); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ---------- Composer ---------- */
    footer { padding: 10px 16px 16px; }

    .composer {
      max-width: 800px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 10px 10px 10px 18px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .composer:focus-within {
      border-color: var(--accent-2);
      box-shadow: 0 0 0 4px rgba(124, 92, 255, 0.15), var(--shadow);
    }

    textarea {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 0.95rem;
      line-height: 1.5;
      min-height: 28px;
      max-height: 200px;
      padding: 6px 0;
    }
    textarea::placeholder { color: var(--muted); }

    #send-btn {
      width: 42px; height: 42px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, var(--accent), #ff5e00);
      color: #111;
      font-size: 1.05rem;
      font-weight: 700;
      flex-shrink: 0;
      transition: transform 0.12s, opacity 0.2s;
    }
    #send-btn:hover:not(:disabled) { transform: scale(1.06); }
    #send-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .hint {
      max-width: 800px;
      margin: 8px auto 0;
      font-size: 0.72rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }

    .overlay { display: none; }

    /* ---------- Responsive ---------- */
    @media (max-width: 860px) {
      aside {
        position: fixed;
        inset: 0 auto 0 0;
        z-index: 20;
        transform: translateX(-100%);
        box-shadow: 8px 0 30px rgba(0, 0, 0, 0.3);
      }
      aside.open { transform: translateX(0); }
      #menu-btn { display: inline-block; }
      .overlay.show {
        display: block;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        z-index: 10;
      }
      .content { max-width: 92%; }
      .pill.model { display: none; }
    }
  </style>
</head>
<body>
  <aside id="sidebar">
    <div class="brand">
      <div class="orb"></div>
      <div>
        <div class="brand-name">Cloud Agent</div>
        <div class="brand-sub">AWS learning assistant</div>
      </div>
    </div>

    <button class="new-chat" id="new-chat-btn" type="button">+ New session</button>

    <div class="section-label">Sessions</div>
    <ul id="session-list"></ul>

    <div class="status-card">
      <div class="status-row"><span>Agent</span><b><span class="live-dot"></span>Online</b></div>
      <div class="status-row"><span>Engine</span><b>Amazon Bedrock</b></div>
      <div class="status-row"><span>Region</span><b>ap-south-1</b></div>
      <div class="status-row"><span>Memory</span><b>DynamoDB</b></div>
    </div>
  </aside>

  <div class="overlay" id="overlay"></div>

  <main>
    <header>
      <div class="header-left">
        <button id="menu-btn" type="button" aria-label="Open sidebar">☰</button>
        <div class="title-text" id="chat-title">New session</div>
      </div>
      <div class="header-right">
        <span class="pill model">Claude · Bedrock</span>
        <span class="pill" id="status"><span class="dot"></span><span id="status-text">Ready</span></span>
        <button class="icon-btn" id="theme-btn" type="button" aria-label="Toggle theme">☀️</button>
      </div>
    </header>

    <div id="chat">
      <div class="inner" id="messages"></div>
    </div>

    <footer>
      <form id="chat-form">
        <div class="composer">
          <textarea id="question" rows="1" maxlength="2000" placeholder="Ask the agent about AWS or cloud computing..."></textarea>
          <button id="send-btn" type="submit" aria-label="Send">↑</button>
        </div>
      </form>
      <div class="hint">
        <span>Enter to send · Shift+Enter for a new line</span>
        <span id="counter">0 / 2000</span>
      </div>
    </footer>
  </main>

  <script>
    // ==========================================
    // CONFIGURATION
    // ==========================================
    const FUNCTION_URL = "https://jv4gc7vdjljgef3b327ga5whf40xtuda.lambda-url.ap-south-1.on.aws/";
    const USER_ID = "rutvik";
    const REQUEST_TIMEOUT_MS = 60000;
    const STORAGE_KEY = "cloudAgentSessions_v1";
    const THEME_KEY = "cloudAgentTheme";
    const MAX_LENGTH = 2000;
    const STAGE_INTERVAL_MS = 1600;

    const STAGES = [
      "Reading your question",
      "Querying Amazon Bedrock",
      "Drafting the answer",
      "Saving to DynamoDB",
    ];

    const SUGGESTIONS = [
      { title: "Explain Amazon EC2", detail: "Compute, instance types and pricing" },
      { title: "Compare S3 storage classes", detail: "Which tier fits my data?" },
      { title: "How does IAM work?", detail: "Users, roles and policies" },
      { title: "What is a VPC?", detail: "Networking in AWS explained" },
    ];

    // ==========================================
    // ELEMENTS
    // ==========================================
    const $ = (id) => document.getElementById(id);
    const sidebar = $("sidebar");
    const overlay = $("overlay");
    const sessionList = $("session-list");
    const chat = $("chat");
    const messagesEl = $("messages");
    const chatTitle = $("chat-title");
    const form = $("chat-form");
    const input = $("question");
    const sendBtn = $("send-btn");
    const statusEl = $("status");
    const statusText = $("status-text");
    const counter = $("counter");
    const themeBtn = $("theme-btn");

    // ==========================================
    // STATE
    // ==========================================
    let sessions = loadSessions();
    let activeId = sessions[0].id;
    let busy = false;
    let busySessionId = null;
    let stage = 0;
    let stageTimer = null;

    // ==========================================
    // STORAGE
    // ==========================================
    function makeSession() {
      return {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
        title: "New session",
        messages: [],
        updatedAt: Date.now(),
      };
    }

    function loadSessions() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        if (Array.isArray(saved) && saved.length) {
          return saved.sort((a, b) => b.updatedAt - a.updatedAt);
        }
      } catch {}
      return [makeSession()];
    }

    function persist() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions)); } catch {}
    }

    function getActive() {
      return sessions.find((s) => s.id === activeId);
    }

    // ==========================================
    // MARKDOWN (escape first, then format)
    // ==========================================
    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatInline(text) {
      return text
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/\*([^*\s][^*]*)\*/g, "<em>$1</em>");
    }

    // Lists stay open across blank lines, so "1. ... <blank> 2. ..." renders as one list
    function renderBlocks(text) {
      const lines = escapeHtml(text).split("\n");
      let html = "";
      let listType = null;

      const closeList = () => {
        if (listType) { html += `</${listType}>`; listType = null; }
      };

      for (const raw of lines) {
        const line = raw.trimEnd();
        const heading = line.match(/^(#{1,3})\s+(.*)$/);
        const ordered = line.match(/^\s*\d+\.\s+(.*)$/);
        const unordered = line.match(/^\s*[-*]\s+(.*)$/);

        if (heading) {
          closeList();
          const tag = heading[1].length === 1 ? "h3" : "h4";
          html += `<${tag}>${formatInline(heading[2])}</${tag}>`;
        } else if (ordered) {
          if (listType !== "ol") { closeList(); html += "<ol>"; listType = "ol"; }
          html += `<li>${formatInline(ordered[1])}</li>`;
        } else if (unordered) {
          if (listType !== "ul") { closeList(); html += "<ul>"; listType = "ul"; }
          html += `<li>${formatInline(unordered[1])}</li>`;
        } else if (line.trim() === "") {
          // Ignore blank lines so the current list can continue
        } else {
          closeList();
          html += `<p>${formatInline(line)}</p>`;
        }
      }

      closeList();
      return html;
    }

    function renderMarkdown(text) {
      // Odd-indexed parts are fenced code blocks
      return text.split("```").map((part, i) => {
        if (i % 2 === 1) {
          const code = part.replace(/^[\w+#.-]*\n/, "").replace(/\n$/, "");
          return `<pre><code>${escapeHtml(code)}</code></pre>`;
        }
        return renderBlocks(part);
      }).join("");
    }

    // ==========================================
    // RENDERING
    // ==========================================
    function formatTime(iso) {
      return new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function createRow(entry) {
      const row = document.createElement("div");
      row.className = `row ${entry.role}`;

      const avatar = document.createElement("div");
      if (entry.role === "assistant") {
        avatar.className = "orb";
        avatar.style.width = "32px";
        avatar.style.height = "32px";
      } else {
        avatar.className = "avatar";
        avatar.textContent = "You";
      }

      const content = document.createElement("div");
      content.className = "content";

      const bubble = document.createElement("div");
      bubble.className = "bubble" + (entry.error ? " error" : "");

      if (entry.role === "assistant") {
        bubble.innerHTML = renderMarkdown(entry.text);
      } else {
        bubble.textContent = entry.text;
      }

      const meta = document.createElement("div");
      meta.className = "meta";

      if (entry.time) {
        const time = document.createElement("span");
        time.textContent = formatTime(entry.time);
        meta.appendChild(time);
      }

      if (entry.role === "assistant" && !entry.error) {
        const copy = document.createElement("button");
        copy.className = "copy-btn";
        copy.type = "button";
        copy.textContent = "Copy";
        copy.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(entry.text);
            copy.textContent = "Copied";
          } catch {
            copy.textContent = "Failed";
          }
          setTimeout(() => (copy.textContent = "Copy"), 1500);
        });
        meta.appendChild(copy);
      }

      content.append(bubble, meta);
      row.append(avatar, content);
      return row;
    }

    function showWelcome() {
      const wrap = document.createElement("div");
      wrap.className = "welcome";
      wrap.innerHTML = `
        <div class="orb big"></div>
        <h2>What do you want to build?</h2>
        <p>Ask about AWS services, architecture, IAM, networking, or certification topics.</p>
        <div class="chips"></div>
      `;
      const chips = wrap.querySelector(".chips");
      SUGGESTIONS.forEach((s) => {
        const btn = document.createElement("button");
        btn.className = "chip";
        btn.type = "button";
        btn.innerHTML = `${escapeHtml(s.title)}<small>${escapeHtml(s.detail)}</small>`;
        btn.addEventListener("click", () => send(s.title));
        chips.appendChild(btn);
      });
      messagesEl.appendChild(wrap);
    }

    function createThinkingRow() {
      const row = document.createElement("div");
      row.className = "row assistant";
      row.innerHTML = `
        <div class="orb" style="width:32px;height:32px"></div>
        <div class="content">
          <div class="thinking">
            <div class="thinking-title">Agent is working</div>
            <div class="pipeline">
              ${STAGES.map((label, i) => `<div class="step" data-i="${i}"><span class="dot"></span>${label}</div>`).join("")}
            </div>
          </div>
        </div>`;
      updatePipelineUI(row);
      return row;
    }

    function updatePipelineUI(root = document) {
      root.querySelectorAll(".step").forEach((el) => {
        const i = Number(el.dataset.i);
        el.classList.toggle("done", i < stage);
        el.classList.toggle("active", i === stage);
      });
    }

    function renderChat() {
      const session = getActive();
      messagesEl.innerHTML = "";
      chatTitle.textContent = session.title;

      const isBusyHere = busy && busySessionId === session.id;

      if (session.messages.length === 0 && !isBusyHere) {
        showWelcome();
      } else {
        session.messages.forEach((entry) => messagesEl.appendChild(createRow(entry)));
      }

      if (isBusyHere) messagesEl.appendChild(createThinkingRow());

      chat.scrollTop = chat.scrollHeight;
    }

    function renderSidebar() {
      sessionList.innerHTML = "";
      sessions.forEach((session) => {
        const li = document.createElement("li");
        li.className = "session" + (session.id === activeId ? " active" : "");

        const title = document.createElement("span");
        title.className = "session-title";
        title.textContent = session.title;

        const del = document.createElement("button");
        del.className = "session-delete";
        del.type = "button";
        del.title = "Delete session";
        del.textContent = "×";
        del.addEventListener("click", (e) => {
          e.stopPropagation();
          deleteSession(session.id);
        });

        li.append(title, del);
        li.addEventListener("click", () => switchSession(session.id));
        sessionList.appendChild(li);
      });
    }

    function setBusy(isBusy) {
      sendBtn.disabled = isBusy;
      statusText.textContent = isBusy ? "Working" : "Ready";
      statusEl.classList.toggle("busy", isBusy);
    }

    // ==========================================
    // PIPELINE ANIMATION
    // The backend returns one response at the end, so these stages
    // show progress visually. They don't reflect exact server timing.
    // ==========================================
    function startPipeline() {
      stage = 0;
      updatePipelineUI();
      stopPipelineTimer();
      stageTimer = setInterval(() => {
        if (stage < STAGES.length - 1) {
          stage++;
          updatePipelineUI();
        }
      }, STAGE_INTERVAL_MS);
    }

    function stopPipelineTimer() {
      if (stageTimer) clearInterval(stageTimer);
      stageTimer = null;
    }

    // ==========================================
    // SESSION ACTIONS
    // ==========================================
    function newChat() {
      const existingEmpty = sessions.find((s) => s.messages.length === 0);
      if (existingEmpty) {
        activeId = existingEmpty.id;
      } else {
        const session = makeSession();
        sessions.unshift(session);
        activeId = session.id;
      }
      persist();
      renderSidebar();
      renderChat();
      closeSidebar();
      input.focus();
    }

    function switchSession(id) {
      activeId = id;
      renderSidebar();
      renderChat();
      closeSidebar();
    }

    function deleteSession(id) {
      const session = sessions.find((s) => s.id === id);
      if (!session) return;
      if (!confirm(`Delete "${session.title}" from this browser? DynamoDB records are not affected.`)) return;

      sessions = sessions.filter((s) => s.id !== id);
      if (sessions.length === 0) sessions.push(makeSession());
      if (activeId === id) activeId = sessions[0].id;

      persist();
      renderSidebar();
      renderChat();
    }

    // ==========================================
    // API
    // ==========================================
    async function askAgent(question) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);

      try {
        const response = await fetch(FUNCTION_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ userId: USER_ID, question }),
          signal: controller.signal,
        });

        let data;
        try {
          data = await response.json();
        } catch {
          throw new Error(`Unexpected server response (HTTP ${response.status}).`);
        }

        if (!response.ok || !data.success) {
          throw new Error(data.error || `Request failed (HTTP ${response.status}).`);
        }

        return data.message;
      } catch (error) {
        if (error.name === "AbortError") {
          throw new Error("The request timed out. Please try again.");
        }
        if (error instanceof TypeError) {
          throw new Error("Could not reach the agent. Check the Function URL and your connection.");
        }
        throw error;
      } finally {
        clearTimeout(timer);
      }
    }

    // ==========================================
    // SEND
    // ==========================================
    async function send(text) {
      text = text.trim();
      if (!text || busy) return;

      const session = getActive();
      session.messages.push({ role: "user", text, time: new Date().toISOString() });
      if (session.title === "New session") {
        session.title = text.length > 40 ? text.slice(0, 40) + "..." : text;
      }
      session.updatedAt = Date.now();
      persist();

      input.value = "";
      autoResize();
      updateCounter();

      busy = true;
      busySessionId = session.id;
      setBusy(true);
      renderSidebar();
      renderChat();
      startPipeline();

      let entry;
      try {
        const answer = await askAgent(text);
        entry = { role: "assistant", text: answer, time: new Date().toISOString() };
      } catch (error) {
        entry = { role: "assistant", text: error.message, time: new Date().toISOString(), error: true };
      }

      stopPipelineTimer();
      stage = STAGES.length - 1;

      // Save to the session the request started in, even if the user switched chats
      session.messages.push(entry);
      session.updatedAt = Date.now();
      persist();

      busy = false;
      busySessionId = null;
      setBusy(false);
      renderSidebar();
      renderChat();
      input.focus();
    }

    // ==========================================
    // EVENTS
    // ==========================================
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      send(input.value);
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    function autoResize() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 200) + "px";
    }

    function updateCounter() {
      counter.textContent = `${input.value.length} / ${MAX_LENGTH}`;
    }

    input.addEventListener("input", () => {
      autoResize();
      updateCounter();
    });

    $("new-chat-btn").addEventListener("click", newChat);

    $("menu-btn").addEventListener("click", () => {
      sidebar.classList.add("open");
      overlay.classList.add("show");
    });

    function closeSidebar() {
      sidebar.classList.remove("open");
      overlay.classList.remove("show");
    }
    overlay.addEventListener("click", closeSidebar);

    // Theme
    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      themeBtn.textContent = theme === "dark" ? "☀️" : "🌙";
    }

    themeBtn.addEventListener("click", () => {
      const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      applyTheme(next);
      try { localStorage.setItem(THEME_KEY, next); } catch {}
    });

    try {
      applyTheme(localStorage.getItem(THEME_KEY) || "dark");
    } catch {
      applyTheme("dark");
    }

    // Initial render
    renderSidebar();
    renderChat();
    updateCounter();
    input.focus();
  </script>
</body>
</html>
